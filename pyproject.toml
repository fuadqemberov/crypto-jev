[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-strategies"
version = "1.0.0"
description = "Top-5 consensus technical-analysis strategies, each paper-trading its own 2000 USDT virtual USDT-M futures account on live Binance data"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "python-dotenv>=1,<2", "pandas>=2,<4", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*", "backtest*"]

[tool.setuptools.package-data]
app = ["static/*"]
backtest = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
