[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-jev"
version = "0.3.0"
description = "JEV-directed crypto analysis with a guarded Freqtrade paper executor"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "python-dotenv>=1,<2", "aiolimiter==1.3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
paper = ["freqtrade==2026.8"]
backtest = ["pandas>=2,<3", "numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["app*", "backtest*"]

[tool.setuptools.package-data]
app = ["static/*"]
backtest = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
